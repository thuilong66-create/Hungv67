<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BẢO BỐI DỰ ĐOÁN - HƯNG ADMIN</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00aee0; --secondary: #e3001b; --accent: #ffd900; --text-main: #333333; --bg-gradient: linear-gradient(135deg, #87ceeb 0%, #e0f7fa 100%); --panel-bg: #ffffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Nunito', sans-serif; background: var(--bg-gradient); color: var(--text-main); overflow-x: hidden; min-height: 100vh; }
        
        header { height: 65px; background: var(--primary); border-bottom: 4px solid var(--secondary); display: flex; justify-content: space-between; align-items: center; padding: 0 15px; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .logo { display: flex; align-items: center; gap: 8px; font-family: 'Fredoka One'; font-size: 1.1rem; color: #fff; text-shadow: 2px 2px 0px rgba(0,0,0,0.2); }
        .profile-badge { background: #fff; border: 2px solid var(--secondary); color: var(--secondary); padding: 5px 10px; border-radius: 15px; font-size: 12px; font-weight: bold; cursor: pointer; display: flex; flex-direction: column; align-items: flex-end;}
        
        #auth-wrapper, .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; z-index: 999; backdrop-filter: blur(5px); background: rgba(0,0,0,0.6); }
        .auth-box, .modal-box { background: var(--panel-bg); border: 4px solid var(--primary); border-radius: 25px; padding: 25px; width: 90%; max-width: 400px; position: relative; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        
        #main-dashboard { display: none; grid-template-columns: 1fr; gap: 15px; padding: 15px; max-width: 800px; margin: 0 auto; }
        .panel { background: var(--panel-bg); border: 4px solid var(--primary); border-radius: 25px; padding: 20px; box-shadow: 0 5px 15px rgba(0, 174, 224, 0.15); }
        .panel-title { font-family: 'Fredoka One'; font-size: 1.2rem; color: var(--primary); margin-bottom: 15px; text-align: center; border-bottom: 2px dashed #b3e5fc; padding-bottom: 10px;}
        
        .cyber-btn { padding: 12px; border: none; border-radius: 12px; cursor: pointer; font-family: 'Fredoka One'; font-size: 14px; color: #fff; width: 100%; margin-bottom: 10px; background: var(--primary); box-shadow: 0 4px 0 #008fba; transition: 0.1s; }
        .cyber-btn:active { transform: translateY(4px); box-shadow: none; }
        .btn-red { background: var(--secondary); box-shadow: 0 4px 0 #b30015; }
        .btn-yellow { background: var(--accent); color: var(--text-main); box-shadow: 0 4px 0 #cca800; }
        .btn-green { background: #2ecc71; box-shadow: 0 4px 0 #27ae60; }
        
        .input-box { width: 100%; background: #f0f8ff; border: 3px solid #b3e5fc; border-radius: 12px; color: var(--text-main); font-family: 'Nunito'; font-size: 1rem; font-weight: bold; padding: 12px; text-align: center; margin-bottom: 15px; outline: none; }
        
        /* CẤU TRÚC OVERLAY GAME */
        #game-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2000; background: #000; }
        #game-frame { width: 100%; height: 100%; border: none; }
        .close-game-btn { position: absolute; top: 10px; left: 10px; background: var(--secondary); color: #fff; border: none; padding: 10px 15px; border-radius: 12px; font-weight: bold; z-index: 2001; box-shadow: 0 4px 0 #b30015; font-family: 'Fredoka One'; cursor: pointer; }
        
        /* KHỐI WIDGET CHỨA CẢ ROBOT VÀ BẢNG */
        #widget-container {
            position: absolute;
            top: 25%;
            left: 5px;
            z-index: 2005;
            display: flex;
            align-items: center; /* Căn giữa robot và bảng */
            gap: 5px;
        }

        /* ẢNH ROBOT - NƠI DUY NHẤT BẮT SỰ KIỆN KÉO */
        .robo-img {
            width: 70px;
            height: auto;
            filter: drop-shadow(0 0 8px #00aee0);
            cursor: grab;
            user-select: none;
            -webkit-user-drag: none;
            touch-action: none; /* Khóa cuộn trang khi chạm vào robot */
        }
        .robo-img:active { cursor: grabbing; transform: scale(0.95); }

        /* BẢNG DỰ ĐOÁN */
        .robo-dialog {
            background: rgba(255, 255, 255, 0.95);
            border: 3px solid var(--primary);
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            width: 150px;
            position: relative;
        }
        
        #robo-menu { display: none; position: absolute; top: 35px; right: 5px; background: #fff; border: 2px solid var(--primary); border-radius: 8px; box-shadow: 0 5px 10px rgba(0,0,0,0.2); z-index: 2010; width: 130px; text-align: left; overflow: hidden;}
        .menu-item { padding: 8px 10px; font-size: 11px; font-weight: bold; cursor: pointer; border-bottom: 1px solid #eee; color: var(--text-main); }
        .menu-item:hover { background: #f0f8ff; color: var(--primary); }
        
        #admin-override-menu { display: none; padding: 5px; background: #ffebee; border-top: 2px dashed red; }
        .btn-hack { flex: 1; border: none; color: white; border-radius: 3px; font-size: 10px; padding: 4px; margin: 0 2px; cursor: pointer; font-weight: bold;}

        .close-btn { position: absolute; top: 5px; right: 15px; font-size: 28px; font-weight: bold; color: var(--secondary); cursor: pointer; }
    </style>
</head>
<body>

    <div id="game-overlay">
        <button class="close-game-btn" onclick="closeGame()"><i class="fas fa-times"></i> ĐÓNG GAME</button>
        <iframe id="game-frame" src=""></iframe>
        
        <!-- KHỐI WIDGET (Di chuyển cả khối này) -->
        <div id="widget-container">
            <!-- CHỈ CHẠM VÀO ĐÂY MỚI KÉO ĐƯỢC -->
            <img class="robo-img" id="drag-handle" src="https://i.ibb.co/8LfL8qMY/1790089819833.png" alt="Robot">
            
            <!-- BẢNG KẾT QUẢ ĐI KÈM BÊN PHẢI -->
            <div class="robo-dialog" id="robo-dialog-panel">
                <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed #b3e5fc; margin-bottom: 8px; padding-bottom: 5px;">
                    <span id="robo-mode-title" style="font-size: 11px; font-weight: 900; color: var(--secondary);">AUTO TOOL</span>
                    <i class="fas fa-bars" style="cursor: pointer; color: var(--primary); font-size: 16px; padding: 0 5px;" onclick="toggleRoboMenu()"></i>
                </div>
                
                <div id="robo-menu">
                    <div class="menu-item" onclick="switchRoboMode('auto')"><i class="fas fa-satellite-dish"></i> Soi cầu Auto</div>
                    <div class="menu-item" onclick="switchRoboMode('md5')"><i class="fas fa-fingerprint"></i> Phân tích MD5</div>
                    <div id="admin-override-menu">
                        <div style="font-size: 9px; color: red; text-align:center; font-weight:bold; margin-bottom:3px;">👑 ADMIN CHỈNH KẾT QUẢ</div>
                        <div style="display: flex; justify-content: space-between;">
                            <button class="btn-hack" style="background: red;" onclick="forceResult('TÀI')">TÀI</button>
                            <button class="btn-hack" style="background: blue;" onclick="forceResult('XỈU')">XỈU</button>
                            <button class="btn-hack" style="background: gray;" onclick="forceResult('AUTO')">AUTO</button>
                        </div>
                    </div>
                </div>

                <div id="robo-view-auto">
                    <div style="font-size: 10px; font-weight: 800;">PHIÊN: <span id="robo-phien">Đang tải...</span></div>
                    <div id="robo-kq" style="font-size: 24px; font-family: 'Fredoka One'; color: var(--secondary); margin: 5px 0;">SCAN</div>
                    <div id="robo-tyle" style="color: var(--primary); font-size: 11px; font-weight: 800;">Đang kết nối API...</div>
                </div>

                <div id="robo-view-md5" style="display: none;">
                    <input type="text" id="robo-md5-input" placeholder="Dán mã MD5..." style="width: 100%; padding: 5px; font-size: 10px; border: 2px solid var(--primary); border-radius: 5px; margin-bottom: 5px; outline: none; font-weight: bold;">
                    <button style="width: 100%; padding: 5px; background: var(--secondary); color: #fff; border: none; border-radius: 5px; font-weight: bold; font-size: 10px; cursor: pointer;" onclick="analyzeMD5_Robo()">DỰ ĐOÁN MD5</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MÀN HÌNH ĐĂNG NHẬP -->
    <div id="auth-wrapper">
        <div class="auth-box" style="text-align: center;">
            <img src="https://upload.wikimedia.org/wikipedia/en/b/bd/Doraemon_character.png" style="width: 100px; margin-bottom: 10px;">
            <div class="panel-title" style="border:none;">HỆ THỐNG DORAEMON</div>
            <input type="text" id="auth-user" class="input-box" placeholder="Tài khoản...">
            <input type="password" id="auth-pass" class="input-box" placeholder="Mật khẩu...">
            <button class="cyber-btn" onclick="auth()">ĐĂNG NHẬP</button>
        </div>
    </div>

    <header id="main-header" style="display:none;">
        <div class="logo"><img src="https://upload.wikimedia.org/wikipedia/en/b/bd/Doraemon_character.png" style="height: 35px;"> HƯNG ADMIN</div>
        <div class="profile-badge">
            <span id="header-user">User</span>
            <span style="color: var(--primary);">0 VNĐ</span>
        </div>
    </header>

    <div id="main-dashboard">
        <div class="panel">
            <div class="panel-title">TỌA ĐỘ SERVER</div>
            <button class="cyber-btn btn-green" onclick="openTool('betvip')">👑 BET VIP (PLAY.BETVIP.FIT)</button>
            <button class="cyber-btn" onclick="openTool('lc79')">📡 LC79.BET</button>
        </div>
    </div>
        <script>
        const API_URLS = {
            'lc79': 'https://wtx.tele68.com/v1/tx/lite-sessions',
            'betvip': 'https://wtx.macminim6.online/v1/tx/lite-sessions'
        };

        let activeTool = 'lc79';
        let apiTimer = null;
        let adminOverride = 'AUTO';

        // MỞ TOOL
        function openTool(toolName) {
            activeTool = toolName;
            document.getElementById('game-overlay').style.display = 'block';
            document.getElementById('game-frame').src = toolName === 'betvip' ? 'https://play.betvip.fit' : 'https://lc79.bet'; 
            document.getElementById('robo-mode-title').innerText = toolName === 'betvip' ? 'AUTO BETVIP' : 'AUTO LC79';

            fetchGameAPI();
            if(apiTimer) clearInterval(apiTimer);
            apiTimer = setInterval(fetchGameAPI, 3000);
        }

        function closeGame() {
            document.getElementById('game-overlay').style.display = 'none';
            document.getElementById('game-frame').src = '';
            if(apiTimer) clearInterval(apiTimer);
        }

        function auth() {
            document.getElementById('auth-wrapper').style.display = 'none';
            document.getElementById('main-header').style.display = 'flex';
            document.getElementById('main-dashboard').style.display = 'grid';
            let user = document.getElementById('auth-user').value || 'HungAdmin';
            document.getElementById('header-user').innerText = user;
            if(user.toLowerCase().includes('admin')) {
                document.getElementById('admin-override-menu').style.display = 'block';
            }
        }

        // ==========================================
        // THUẬT TOÁN API & SOI CẦU
        // ==========================================
        async function fetchGameAPI() {
            try {
                const response = await fetch(API_URLS[activeTool]);
                const data = await response.json();
                let sessions = Array.isArray(data) ? data : (data.data || []);
                if (sessions.length > 0) processPredictionData(sessions);
            } catch (err) {
                document.getElementById('robo-tyle').innerText = 'Đang dò cầu...';
            }
        }

        function processPredictionData(sessions) {
            const latest = sessions[0];
            const currentSessionId = (parseInt(latest.session) || parseInt(latest.id) || 0) + 1;
            
            const history = sessions.slice(0, 10).map(s => {
                if (s.result) return s.result.toUpperCase();
                let total = (s.dice1 || 0) + (s.dice2 || 0) + (s.dice3 || 0) || (s.point || 0);
                return total > 10 ? 'TÀI' : 'XỈU';
            });

            let predict = analyzePattern(history);

            if (adminOverride !== 'AUTO') {
                predict = { result: adminOverride, rate: 99, pattern: 'Chuyển Admin' };
            }

            document.getElementById('robo-phien').innerText = '#' + currentSessionId;
            const kqElem = document.getElementById('robo-kq');
            kqElem.innerText = predict.result;
            kqElem.style.color = predict.result === 'TÀI' ? '#e3001b' : '#00aee0';
            document.getElementById('robo-tyle').innerText = `${predict.pattern} (${predict.rate}%)`;
        }

        function analyzePattern(history) {
            if (history.length < 3) return { result: 'TÀI', rate: 75, pattern: 'Dò Cầu' };
            const [r1, r2, r3, r4] = history;

            if (r1 === r2 && r2 === r3) return { result: r1, rate: 89, pattern: r3 === r4 ? 'Bệt Dài' : 'Cầu Bệt' };
            if (r1 !== r2 && r2 !== r3 && r3 !== r4) return { result: r1 === 'TÀI' ? 'XỈU' : 'TÀI', rate: 86, pattern: 'Cầu 1-1' };
            if (r1 === r2 && r3 === r4 && r1 !== r3) return { result: r1 === 'TÀI' ? 'XỈU' : 'TÀI', rate: 82, pattern: 'Cầu 2-2' };

            const taiCount = history.slice(0, 6).filter(x => x === 'TÀI').length;
            if (taiCount >= 5) return { result: 'XỈU', rate: 80, pattern: 'Nghiêng Xỉu' };
            if (taiCount <= 1) return { result: 'TÀI', rate: 80, pattern: 'Nghiêng Tài' };

            return { result: r1 === 'TÀI' ? 'XỈU' : 'TÀI', rate: 78, pattern: 'Cầu Đảo' };
        }

        function forceResult(val) { adminOverride = val; fetchGameAPI(); }
        function toggleRoboMenu() {
            const menu = document.getElementById('robo-menu');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }
        function switchRoboMode(mode) {
            document.getElementById('robo-menu').style.display = 'none';
            document.getElementById('robo-view-auto').style.display = mode === 'auto' ? 'block' : 'none';
            document.getElementById('robo-view-md5').style.display = mode === 'md5' ? 'block' : 'none';
        }

        // ==========================================
        // LOGIC KÉO THẢ CHUẨN (ÁP DỤNG LÊN PARENT)
        // ==========================================
        const widgetContainer = document.getElementById('widget-container'); // Khối chứa tất cả
        const dragHandle = document.getElementById('drag-handle');           // Chỉ kéo từ ảnh robot
        const dialogPanel = document.getElementById('robo-dialog-panel');    // Bảng kết quả

        let isDragging = false;
        let hasMoved = false;
        let startX, startY, initialLeft, initialTop;

        // Xử lý PC
        dragHandle.addEventListener("mousedown", dragStart);
        document.addEventListener("mousemove", drag);
        document.addEventListener("mouseup", dragEnd);

        // Xử lý Điện Thoại
        dragHandle.addEventListener("touchstart", dragStart, { passive: false });
        document.addEventListener("touchmove", drag, { passive: false });
        document.addEventListener("touchend", dragEnd);

        function dragStart(e) {
            // Chỉ bắt đầu kéo nếu người dùng chạm đúng vào ảnh Robot
            if (e.target !== dragHandle) return;

            if (e.type === "touchstart") {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            } else {
                startX = e.clientX;
                startY = e.clientY;
            }

            // Lấy tọa độ hiện tại của cả cụm (robot + bảng)
            initialLeft = widgetContainer.offsetLeft;
            initialTop = widgetContainer.offsetTop;

            isDragging = true;
            hasMoved = false;
        }

        function drag(e) {
            if (!isDragging) return;

            let currentX = e.type === "touchmove" ? e.touches[0].clientX : e.clientX;
            let currentY = e.type === "touchmove" ? e.touches[0].clientY : e.clientY;

            let dx = currentX - startX;
            let dy = currentY - startY;

            if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
                hasMoved = true;
                e.preventDefault(); // Tránh cuộn web khi đang kéo
            }

            // Cập nhật vị trí cho cả Khối (Container)
            widgetContainer.style.left = (initialLeft + dx) + 'px';
            widgetContainer.style.top = (initialTop + dy) + 'px';
        }

        function dragEnd() {
            isDragging = false;
        }

        // Chỉ Click/Chạm nhẹ (không kéo) thì Ẩn/Hiện bảng
        dragHandle.addEventListener("click", () => {
            if (!hasMoved) {
                dialogPanel.style.display = dialogPanel.style.display === 'none' ? 'block' : 'none';
            }
        });
    </script>
</body>
</html>
